[package]
name = "cmnet"
version = "0.1.0"
edition = "2021"

# CM Network: a stand-in wsock32.dll for CM 01/02 network games over the internet (separate
# from cmui). Build: cargo build --release --target i686-pc-windows-msvc
[lib]
name = "wsock32"
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = "s"
panic = "abort"

[dependencies]
zstd = { version = "0.13", default-features = false }
